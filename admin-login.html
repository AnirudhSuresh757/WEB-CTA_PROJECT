<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN // LOGIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-pulse bg-pulse--lime"></div>
    <div class="bg-pulse bg-pulse--orange"></div>
    <div class="bg-pulse bg-pulse--cyan"></div>
    <div class="bg-data-stream"></div>
    <div class="bg-data-stream"></div>
    <div class="bg-data-stream"></div>
    <div class="bg-data-stream"></div>
    <div class="bg-data-stream"></div>
    <div class="bg-particles">
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
      <div class="bg-particle"></div>
    </div>
    <div class="bg-scanline"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- App -->
  <main class="app">
    <div class="login">
      <div class="login__frame" style="border-color: rgba(255, 106, 0, 0.25);">

        <!-- Corner Accents (Orange) -->
        <div class="corner-accent corner-accent--tl" style="border-color: rgba(255, 106, 0, 0.3);"></div>
        <div class="corner-accent corner-accent--tr" style="border-color: rgba(255, 106, 0, 0.3);"></div>
        <div class="corner-accent corner-accent--bl" style="border-color: rgba(255, 106, 0, 0.3);"></div>
        <div class="corner-accent corner-accent--br" style="border-color: rgba(255, 106, 0, 0.3);"></div>

        <!-- Header -->
        <header class="login__header">
          <div class="login__logo">
            <div class="login__logo-icon" style="border-color: var(--accent-orange); color: var(--accent-orange); background: rgba(255, 106, 0, 0.12);">⚙</div>
            <span class="login__logo-text">ADMIN_AUTH v3.2</span>
          </div>
          <h1 class="login__title" style="color: var(--accent-orange); text-shadow: 0 0 30px rgba(255, 106, 0, 0.1);">Admin Login</h1>
          <p class="login__subtitle">Faculty & Administrator access only</p>
        </header>

        <!-- Login Form -->
        <form class="form" id="loginForm" novalidate>

          <!-- Error Message -->
          <div class="error-msg" id="errorMsg" role="alert">
            <span class="error-msg__icon">!</span>
            <span id="errorText">Invalid credentials. Try again.</span>
          </div>

          <!-- User ID Field -->
          <div class="field">
            <label class="field__label" for="userId">Faculty / Admin ID</label>
            <div class="field__input-wrap">
              <input
                class="field__input"
                type="text"
                id="userId"
                name="userId"
                placeholder="Enter your ID"
                autocomplete="username"
                spellcheck="false"
                required
              >
              <span class="field__icon" style="color: var(--accent-orange);">@</span>
              <div class="field__bar" style="background: linear-gradient(90deg, var(--accent-orange), #ff8833);"></div>
            </div>
          </div>

          <!-- Password Field -->
          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="field__input-wrap">
              <input
                class="field__input"
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <span class="field__icon">*</span>
              <div class="field__bar" style="background: linear-gradient(90deg, var(--accent-orange), #ff8833);"></div>
            </div>
          </div>

          <!-- Submit -->
          <button class="btn-login" type="submit" id="btnLogin" style="background: var(--accent-orange); box-shadow: 0 0 20px rgba(255, 106, 0, 0.2), 0 4px 16px rgba(0, 0, 0, 0.3);">
            Authenticate
          </button>
        </form>

        <!-- Status Bar -->
        <div class="status-bar">
          <span><span class="status-bar__dot" style="background: var(--accent-orange); box-shadow: 0 0 8px rgba(255, 106, 0, 0.4);"></span>ADMIN ACCESS</span>
          <span id="clockDisplay">--:--:--</span>
        </div>

        <!-- Footer -->
        <footer class="login__footer">
          <a href="index.html" style="color: var(--text-muted); text-decoration: none;">← Back to Portal Selection</a>
        </footer>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/validator.js"></script>
  <script>
    (function () {
      'use strict';

      // Auto-redirect if already logged in as admin
      if (Auth.isAdminLoggedIn()) {
        window.location.href = 'admin.html';
        return;
      }

      var form = document.getElementById('loginForm');
      var userIdInput = document.getElementById('userId');
      var passwordInput = document.getElementById('password');
      var btnLogin = document.getElementById('btnLogin');
      var errorMsg = document.getElementById('errorMsg');
      var errorText = document.getElementById('errorText');
      var clockDisplay = document.getElementById('clockDisplay');

      // Field containers
      var userIdField = userIdInput.closest('.field');
      var passwordField = passwordInput.closest('.field');

      // ── Attach Real-Time Validation ──
      Validator.attachField(userIdField, userIdInput, function (val) {
        return Validator.validateRequired(val, 'User ID');
      });
      Validator.attachField(passwordField, passwordInput, function (val) {
        return Validator.validateRequired(val, 'Password');
      });

      var formFields = [
        { fieldEl: userIdField, inputEl: userIdInput, validateFn: function (val) {
          return Validator.validateRequired(val, 'User ID');
        }},
        { fieldEl: passwordField, inputEl: passwordInput, validateFn: function (val) {
          return Validator.validateRequired(val, 'Password');
        }}
      ];

      // Error handling
      function showError(message) {
        errorText.textContent = message;
        errorMsg.classList.add('visible');
        errorMsg.style.animation = 'none';
        errorMsg.offsetHeight;
        errorMsg.style.animation = '';
      }

      function hideError() {
        errorMsg.classList.remove('visible');
      }

      // Loading state
      function setLoading(on) {
        btnLogin.classList.toggle('loading', on);
        btnLogin.disabled = on;
        userIdInput.disabled = on;
        passwordInput.disabled = on;
      }

      // Form submission
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideError();

        // Validate fields with inline errors
        var allValid = Validator.validateAll(formFields);
        if (!allValid) return;

        var userId = userIdInput.value.trim();
        var password = passwordInput.value;

        // Additional credential validation
        var validation = Auth.validateCredentials(userId, password);
        if (!validation.valid) {
          showError(validation.errors[0]);
          return;
        }

        setLoading(true);

        // Authenticate against hardcoded admin credentials
        setTimeout(function () {
          var result = Auth.loginAdmin(userId, password);

          if (!result.success) {
            setLoading(false);
            showError(result.message);
            passwordInput.value = '';
            Validator.resetField(passwordField);
            passwordInput.focus();
            return;
          }

          // Success — create admin session and redirect to admin panel
          Auth.createAdminSession(result.user);

          btnLogin.textContent = 'ACCESS GRANTED';
          btnLogin.classList.remove('loading');
          btnLogin.style.background = '#00ff88';
          btnLogin.style.boxShadow = '0 0 40px rgba(0, 255, 136, 0.5)';

          setTimeout(function () {
            window.location.href = 'admin.html';
          }, 600);

        }, 1000);
      });

      // Clock
      function tick() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        var s = String(now.getSeconds()).padStart(2, '0');
        clockDisplay.textContent = h + ':' + m + ':' + s;
      }
      tick();
      setInterval(tick, 1000);

      // Password visibility toggle
      var passIcon = document.querySelector('#password + .field__icon');
      if (passIcon) {
        passIcon.style.cursor = 'pointer';
        passIcon.style.pointerEvents = 'auto';
        passIcon.style.userSelect = 'none';

        var visible = false;
        passIcon.addEventListener('click', function () {
          visible = !visible;
          passwordInput.type = visible ? 'text' : 'password';
          passIcon.textContent = visible ? 'X' : '*';
          passIcon.style.color = visible ? 'var(--accent-orange)' : '';
        });
      }
    })();
  </script>
</body>
</html>
